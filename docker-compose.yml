x-backend: &backend
  build: ./backend
  environment: &backend-env
    SQLITE_PATH: /data/db.sqlite3
  volumes:
    - dbdata:/data
  depends_on:
    - redis

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend1:
    <<: *backend
    container_name: backend1
    environment:
      <<: *backend-env
      SERVER_ID: B1

  backend2:
    <<: *backend
    container_name: backend2
    environment:
      <<: *backend-env
      SERVER_ID: B2

  backend3:
    <<: *backend
    container_name: backend3
    environment:
      <<: *backend-env
      SERVER_ID: B3

  backend4:
    <<: *backend
    container_name: backend4
    environment:
      <<: *backend-env
      SERVER_ID: B4

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3
      - backend4

  controller:
    build: ./controller
    container_name: controller
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nginx/strategies:/nginx_conf/strategies
      - ./nginx/active_upstream.conf:/nginx_conf/active_upstream.conf
    ports:
      - "5001:5000"
    depends_on:
      - nginx

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  dbdata:
